naftiko: 1.0.0-alpha2
info:
  label: SAP Concur Expense API — Allocations
  description: 'SAP Concur Expense API — Allocations. 1 operations. Lead operation: List Expense Allocations. Self-contained
    Naftiko capability covering one Sap Concur Expense business surface.'
  tags:
  - Sap Concur Expense
  - Allocations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_CONCUR_EXPENSE_API_KEY: SAP_CONCUR_EXPENSE_API_KEY
capability:
  consumes:
  - type: http
    namespace: report-allocations
    baseUri: https://us.api.concursolutions.com/api/v3.0
    description: SAP Concur Expense API — Allocations business capability. Self-contained, no shared references.
    resources:
    - name: expense-allocations
      path: /expense/allocations
      operations:
      - name: listallocations
        method: GET
        description: List Expense Allocations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: entryID
          in: query
          type: string
          description: The expense entry ID to retrieve allocations for
          required: true
        - name: offset
          in: query
          type: string
          description: Starting page offset for pagination
        - name: limit
          in: query
          type: integer
          description: Number of records to return per page (max 100)
    authentication:
      type: bearer
      token: '{{env.SAP_CONCUR_EXPENSE_API_KEY}}'
  exposes:
  - type: rest
    namespace: report-allocations-rest
    port: 8080
    description: REST adapter for SAP Concur Expense API — Allocations. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/expense/allocations
      name: expense-allocations
      description: REST surface for expense-allocations.
      operations:
      - method: GET
        name: listallocations
        description: List Expense Allocations
        call: report-allocations.listallocations
        with:
          entryID: rest.entryID
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: report-allocations-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP Concur Expense API — Allocations. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-expense-allocations
      description: List Expense Allocations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: report-allocations.listallocations
      with:
        entryID: tools.entryID
        offset: tools.offset
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
