naftiko: "1.0.0-alpha1"

info:
  label: "SAP Concur Receipt and Quick Expense API"
  description: >-
    SAP Concur APIs for capturing expenses on-the-go via quick expenses and
    managing receipt images. Supports the mobile expense capture workflow
    before formal report submission.
  tags:
    - Expense Management
    - Mobile
    - Receipts
    - SAP Concur
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      CONCUR_OAUTH_TOKEN: CONCUR_OAUTH_TOKEN

capability:
  consumes:
    - type: http
      namespace: concur-receipt-capture
      baseUri: https://us.api.concursolutions.com/api/v3.0
      description: "SAP Concur Quick Expense and Receipt Image APIs"
      authentication:
        type: bearer
        token: "{{CONCUR_OAUTH_TOKEN}}"
      resources:
        - name: quick-expenses
          path: /expense/quickexpenses
          description: "Quick expense capture"
          operations:
            - name: list-quick-expenses
              method: GET
              description: "List quick expenses for the current user"
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Number of records to return"
                - name: modifiedDateAfter
                  in: query
                  type: string
                  required: false
                  description: "Filter by modification date"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-quick-expense
              method: POST
              description: "Capture a quick expense"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  ExpenseTypeCode: "{{tools.expenseTypeCode}}"
                  TransactionDate: "{{tools.transactionDate}}"
                  TransactionAmount: "{{tools.transactionAmount}}"
                  CurrencyCode: "{{tools.currencyCode}}"
                  VendorDescription: "{{tools.vendor}}"
                  Comment: "{{tools.comment}}"
        - name: quick-expense-by-id
          path: /expense/quickexpenses/{id}
          description: "Single quick expense operations"
          operations:
            - name: get-quick-expense
              method: GET
              description: "Get a quick expense by ID"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The quick expense ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-quick-expense
              method: DELETE
              description: "Delete a quick expense"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The quick expense ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: receipt-images
          path: /expense/receiptimages
          description: "Receipt image management"
          operations:
            - name: list-receipt-images
              method: GET
              description: "List receipt images"
              inputParameters:
                - name: entryID
                  in: query
                  type: string
                  required: false
                  description: "Filter by expense entry ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: receipt-image-by-id
          path: /expense/receiptimages/{id}
          description: "Single receipt image operations"
          operations:
            - name: get-receipt-image
              method: GET
              description: "Retrieve a receipt image URL"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The receipt image ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-receipt-image
              method: DELETE
              description: "Delete a receipt image"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The receipt image ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: concur-receipt-capture-api
      resources:
        - path: /v1/quick-expenses
          name: quick-expenses
          description: "Quick expense management"
          operations:
            - method: GET
              name: list-quick-expenses
              description: "List quick expenses"
              call: "concur-receipt-capture.list-quick-expenses"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-quick-expense
              description: "Create quick expense"
              call: "concur-receipt-capture.create-quick-expense"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/receipts
          name: receipts
          description: "Receipt image management"
          operations:
            - method: GET
              name: list-receipts
              description: "List receipt images"
              call: "concur-receipt-capture.list-receipt-images"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/receipts/{id}
          name: receipt-by-id
          description: "Single receipt image"
          operations:
            - method: GET
              name: get-receipt
              description: "Get receipt image URL"
              call: "concur-receipt-capture.get-receipt-image"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: concur-receipt-capture-mcp
      transport: http
      tools:
        - name: list-quick-expenses
          description: "List unassigned quick expenses captured on mobile"
          hints:
            readOnly: true
            openWorld: true
          call: "concur-receipt-capture.list-quick-expenses"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-quick-expense
          description: "Capture a quick expense for later assignment to a report"
          hints:
            readOnly: false
            destructive: false
          call: "concur-receipt-capture.create-quick-expense"
          with:
            expenseTypeCode: "tools.expenseTypeCode"
            transactionDate: "tools.transactionDate"
            transactionAmount: "tools.transactionAmount"
            currencyCode: "tools.currencyCode"
            vendor: "tools.vendor"
            comment: "tools.comment"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-receipt-images
          description: "List receipt images attached to expense entries"
          hints:
            readOnly: true
            openWorld: true
          call: "concur-receipt-capture.list-receipt-images"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-receipt-image
          description: "Retrieve a receipt image download URL"
          hints:
            readOnly: true
            openWorld: false
          call: "concur-receipt-capture.get-receipt-image"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
