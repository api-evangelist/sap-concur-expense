  contact:
  - type: Support
    url: https://developer.concur.com/support
- name: Expense Allocations API
  description: >-
    Manage allocation of expenses across multiple cost centers, projects, departments, or GL accounts.
    Supports percentage-based and amount-based allocation splits for corporate expense policy compliance
    and financial reporting.
  image: https://www.concur.com/themes/custom/concur/logo.svg
  humanURL: >-
    https://developer.concur.com/api-reference/expense/expense-report/expense-allocations.html
  baseURL: https://us.api.concursolutions.com/api/v3.0
