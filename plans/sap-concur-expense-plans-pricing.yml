description: SAP Concur Expense is a module of the SAP Concur platform, priced per-employee/month plus per-expense-report fees. Sold via Concur sales; no public rate card. Partner API access requires registration with a Partner Enablement Manager.
sources:
  - https://developer.concur.com/
  - https://developer.concur.com/api-reference/expense/
notes: Public pricing pages for this provider return HTTP 403 to automated fetches or require partner/sales engagement; trimmed to a single Contact Sales plan until a published rate card is available.
plans:
  - id: sap-concur-expense-contact-sales
    name: Contact Sales
    type: enterprise
    description: All commercial terms are negotiated through SAP sales, the SAP Store, or SAP partners.
    entries:
      - label: Custom contract
        name: custom
        type: subscription
        metric: varies
        limit: -1
        timeFrame: year
        geo: configurable
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: SAP Sales Engagement
      - name: SAP Store
      - name: SAP Partner Channel
