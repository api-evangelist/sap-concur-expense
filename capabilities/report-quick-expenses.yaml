naftiko: 1.0.0-alpha2
info:
  label: SAP Concur Expense API — Quick Expenses
  description: 'SAP Concur Expense API — Quick Expenses. 5 operations. Lead operation: List Quick Expenses. Self-contained
    Naftiko capability covering one Sap Concur Expense business surface.'
  tags:
  - Sap Concur Expense
  - Quick Expenses
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_CONCUR_EXPENSE_API_KEY: SAP_CONCUR_EXPENSE_API_KEY
capability:
  consumes:
  - type: http
    namespace: report-quick-expenses
    baseUri: https://us.api.concursolutions.com/api/v3.0
    description: SAP Concur Expense API — Quick Expenses business capability. Self-contained, no shared references.
    resources:
    - name: expense-quickexpenses
      path: /expense/quickexpenses
      operations:
      - name: listquickexpenses
        method: GET
        description: List Quick Expenses
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: offset
          in: query
          type: string
          description: Starting page offset for pagination
        - name: limit
          in: query
          type: integer
          description: Number of records to return per page (max 100)
        - name: modifiedDateBefore
          in: query
          type: string
          description: Return quick expenses modified before this date
        - name: modifiedDateAfter
          in: query
          type: string
          description: Return quick expenses modified after this date
      - name: createquickexpense
        method: POST
        description: Create Quick Expense
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: expense-quickexpenses-id
      path: /expense/quickexpenses/{id}
      operations:
      - name: getquickexpense
        method: GET
        description: Get Quick Expense
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The unique identifier of the quick expense
          required: true
      - name: updatequickexpense
        method: PUT
        description: Update Quick Expense
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The unique identifier of the quick expense
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletequickexpense
        method: DELETE
        description: Delete Quick Expense
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The unique identifier of the quick expense
          required: true
    authentication:
      type: bearer
      token: '{{env.SAP_CONCUR_EXPENSE_API_KEY}}'
  exposes:
  - type: rest
    namespace: report-quick-expenses-rest
    port: 8080
    description: REST adapter for SAP Concur Expense API — Quick Expenses. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/expense/quickexpenses
      name: expense-quickexpenses
      description: REST surface for expense-quickexpenses.
      operations:
      - method: GET
        name: listquickexpenses
        description: List Quick Expenses
        call: report-quick-expenses.listquickexpenses
        with:
          offset: rest.offset
          limit: rest.limit
          modifiedDateBefore: rest.modifiedDateBefore
          modifiedDateAfter: rest.modifiedDateAfter
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createquickexpense
        description: Create Quick Expense
        call: report-quick-expenses.createquickexpense
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/expense/quickexpenses/{id}
      name: expense-quickexpenses-id
      description: REST surface for expense-quickexpenses-id.
      operations:
      - method: GET
        name: getquickexpense
        description: Get Quick Expense
        call: report-quick-expenses.getquickexpense
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatequickexpense
        description: Update Quick Expense
        call: report-quick-expenses.updatequickexpense
        with:
          id: rest.id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletequickexpense
        description: Delete Quick Expense
        call: report-quick-expenses.deletequickexpense
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: report-quick-expenses-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP Concur Expense API — Quick Expenses. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-quick-expenses
      description: List Quick Expenses
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: report-quick-expenses.listquickexpenses
      with:
        offset: tools.offset
        limit: tools.limit
        modifiedDateBefore: tools.modifiedDateBefore
        modifiedDateAfter: tools.modifiedDateAfter
      outputParameters:
      - type: object
        mapping: $.
    - name: create-quick-expense
      description: Create Quick Expense
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: report-quick-expenses.createquickexpense
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-quick-expense
      description: Get Quick Expense
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: report-quick-expenses.getquickexpense
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: update-quick-expense
      description: Update Quick Expense
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: report-quick-expenses.updatequickexpense
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-quick-expense
      description: Delete Quick Expense
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: report-quick-expenses.deletequickexpense
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
