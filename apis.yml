apis:
- name: Digital Tax Invoice API
  description: >-
    Retrieve digital tax invoice data associated with expense entries for compliance and auditing in jurisdictions
    that require electronic invoicing (e-invoicing). Provides access to CFDI (Mexico), NF-e (Brazil),
    and other country-specific digital tax documents.
  image: https://www.concur.com/themes/custom/concur/logo.svg
  humanURL: >-
    https://developer.concur.com/api-reference/expense/digital-tax-invoices/digital-tax-invoice.html
  baseURL: https://us.api.concursolutions.com/api/v3.0
  version: '3.0'
  tags:
  - Compliance
  - Invoice
  - Tax
  properties:
  - type: Documentation
    url: >-
      https://developer.concur.com/api-reference/expense/digital-tax-invoices/digital-tax-invoice.html
  contact:
  - type: Support
    url: https://developer.concur.com/support
- name: Expense Group Configuration API
  description: >-
    Retrieve expense group configurations including expense types, expense policies, payment types, and
    workflow settings. Used to dynamically configure expense capture UIs and enforce policy rules during
    expense report creation.
  image: https://www.concur.com/themes/custom/concur/logo.svg
  humanURL: >-
    https://developer.concur.com/api-reference/expense/expense-report/expense-group-configurations.html
  baseURL: https://us.api.concursolutions.com/api/v3.0
  version: '3.0'
  tags:
