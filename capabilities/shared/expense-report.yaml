naftiko: "1.0.0-alpha1"

info:
  label: "SAP Concur Expense Report API"
  description: >-
    SAP Concur v3 REST API for managing expense reports — the primary artifact
    for employee expense submission, approval routing, and reimbursement. Covers
    report lifecycle from creation through approval.
  tags:
    - Expense Management
    - Financial Management
    - SAP Concur
    - Travel
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      CONCUR_OAUTH_TOKEN: CONCUR_OAUTH_TOKEN

capability:
  consumes:
    - type: http
      namespace: concur-expense-report
      baseUri: https://us.api.concursolutions.com/api/v3.0
      description: "SAP Concur Expense Report v3 API"
      authentication:
        type: bearer
        token: "{{CONCUR_OAUTH_TOKEN}}"
      resources:
        - name: expense-reports
          path: /expense/reports
          description: "Expense report collection"
          operations:
            - name: list-expense-reports
              method: GET
              description: "List expense reports for the current user"
              inputParameters:
                - name: approvalStatusCode
                  in: query
                  type: string
                  required: false
                  description: "Filter by approval status code"
                - name: paymentStatusCode
                  in: query
                  type: string
                  required: false
                  description: "Filter by payment status code"
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Number of records to return (max 100)"
                - name: offset
                  in: query
                  type: string
                  required: false
                  description: "Pagination offset"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-expense-report
              method: POST
              description: "Create a new expense report"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  Name: "{{tools.name}}"
                  Purpose: "{{tools.purpose}}"
                  PolicyID: "{{tools.policyId}}"
        - name: expense-report-by-id
          path: /expense/reports/{id}
          description: "Single expense report operations"
          operations:
            - name: get-expense-report
              method: GET
              description: "Retrieve a specific expense report by ID"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The expense report ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-expense-report
              method: PUT
              description: "Update an expense report"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The expense report ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  Name: "{{tools.name}}"
                  Purpose: "{{tools.purpose}}"
            - name: delete-expense-report
              method: DELETE
              description: "Delete a draft expense report"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The expense report ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: expense-entries
          path: /expense/entries
          description: "Expense entry collection"
          operations:
            - name: list-expense-entries
              method: GET
              description: "List expense entries for a report"
              inputParameters:
                - name: reportID
                  in: query
                  type: string
                  required: true
                  description: "The expense report ID"
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Number of records to return"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-expense-entry
              method: POST
              description: "Create a new expense entry within a report"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  ReportID: "{{tools.reportId}}"
                  ExpenseTypeCode: "{{tools.expenseTypeCode}}"
                  TransactionDate: "{{tools.transactionDate}}"
                  TransactionAmount: "{{tools.transactionAmount}}"
                  TransactionCurrencyCode: "{{tools.currencyCode}}"
                  BusinessPurpose: "{{tools.businessPurpose}}"
                  VendorDescription: "{{tools.vendor}}"
        - name: expense-entry-by-id
          path: /expense/entries/{id}
          description: "Single expense entry operations"
          operations:
            - name: get-expense-entry
              method: GET
              description: "Retrieve a specific expense entry by ID"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The expense entry ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-expense-entry
              method: DELETE
              description: "Delete an expense entry from a draft report"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The expense entry ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: payment-batches
          path: /expense/paymentbatches
          description: "Payment batch management"
          operations:
            - name: list-payment-batches
              method: GET
              description: "List payment batches for reimbursement"
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Number of records to return"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: expense-group-configs
          path: /expense/expensegroupconfigurations
          description: "Expense policy configuration"
          operations:
            - name: list-expense-group-configurations
              method: GET
              description: "List expense group policy configurations"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: concur-expense-report-api
      resources:
        - path: /v1/reports
          name: reports
          description: "Expense report management"
          operations:
            - method: GET
              name: list-reports
              description: "List expense reports"
              call: "concur-expense-report.list-expense-reports"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-report
              description: "Create expense report"
              call: "concur-expense-report.create-expense-report"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/reports/{id}
          name: report-by-id
          description: "Single expense report"
          operations:
            - method: GET
              name: get-report
              description: "Get expense report"
              call: "concur-expense-report.get-expense-report"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/entries
          name: entries
          description: "Expense entries"
          operations:
            - method: GET
              name: list-entries
              description: "List expense entries"
              call: "concur-expense-report.list-expense-entries"
              with:
                reportID: "rest.reportID"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-entry
              description: "Create expense entry"
              call: "concur-expense-report.create-expense-entry"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: concur-expense-report-mcp
      transport: http
      tools:
        - name: list-expense-reports
          description: "List expense reports with optional status filters"
          hints:
            readOnly: true
            openWorld: true
          call: "concur-expense-report.list-expense-reports"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-expense-report
          description: "Retrieve a specific expense report by ID"
          hints:
            readOnly: true
            openWorld: false
          call: "concur-expense-report.get-expense-report"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-expense-report
          description: "Create a new expense report for submission"
          hints:
            readOnly: false
            destructive: false
          call: "concur-expense-report.create-expense-report"
          with:
            name: "tools.name"
            purpose: "tools.purpose"
            policyId: "tools.policyId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-expense-entries
          description: "List all expense entries within a specific report"
          hints:
            readOnly: true
            openWorld: true
          call: "concur-expense-report.list-expense-entries"
          with:
            reportID: "tools.reportID"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-expense-entry
          description: "Add a new expense line item to an expense report"
          hints:
            readOnly: false
            destructive: false
          call: "concur-expense-report.create-expense-entry"
          with:
            reportId: "tools.reportId"
            expenseTypeCode: "tools.expenseTypeCode"
            transactionDate: "tools.transactionDate"
            transactionAmount: "tools.transactionAmount"
            currencyCode: "tools.currencyCode"
            businessPurpose: "tools.businessPurpose"
            vendor: "tools.vendor"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-payment-batches
          description: "List payment batches for approved expense reimbursements"
          hints:
            readOnly: true
            openWorld: true
          call: "concur-expense-report.list-payment-batches"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-expense-group-configurations
          description: "List expense policy configurations including expense types and workflow rules"
          hints:
            readOnly: true
            openWorld: true
          call: "concur-expense-report.list-expense-group-configurations"
          outputParameters:
            - type: object
              mapping: "$."
