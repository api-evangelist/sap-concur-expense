naftiko: 1.0.0-alpha2
info:
  label: SAP Concur Expense API — Payment Batches
  description: 'SAP Concur Expense API — Payment Batches. 1 operations. Lead operation: List Payment Batches. Self-contained
    Naftiko capability covering one Sap Concur Expense business surface.'
  tags:
  - Sap Concur Expense
  - Payment Batches
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_CONCUR_EXPENSE_API_KEY: SAP_CONCUR_EXPENSE_API_KEY
capability:
  consumes:
  - type: http
    namespace: report-payment-batches
    baseUri: https://us.api.concursolutions.com/api/v3.0
    description: SAP Concur Expense API — Payment Batches business capability. Self-contained, no shared references.
    resources:
    - name: expense-paymentbatches
      path: /expense/paymentbatches
      operations:
      - name: listpaymentbatches
        method: GET
        description: List Payment Batches
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: offset
          in: query
          type: string
          description: Starting page offset for pagination
        - name: limit
          in: query
          type: integer
          description: Number of records to return per page
        - name: batchID
          in: query
          type: string
          description: Filter by specific payment batch ID
    authentication:
      type: bearer
      token: '{{env.SAP_CONCUR_EXPENSE_API_KEY}}'
  exposes:
  - type: rest
    namespace: report-payment-batches-rest
    port: 8080
    description: REST adapter for SAP Concur Expense API — Payment Batches. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/expense/paymentbatches
      name: expense-paymentbatches
      description: REST surface for expense-paymentbatches.
      operations:
      - method: GET
        name: listpaymentbatches
        description: List Payment Batches
        call: report-payment-batches.listpaymentbatches
        with:
          offset: rest.offset
          limit: rest.limit
          batchID: rest.batchID
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: report-payment-batches-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP Concur Expense API — Payment Batches. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-payment-batches
      description: List Payment Batches
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: report-payment-batches.listpaymentbatches
      with:
        offset: tools.offset
        limit: tools.limit
        batchID: tools.batchID
      outputParameters:
      - type: object
        mapping: $.
